# Solgar Internal Platform — Nginx reverse proxy configuration.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/solgar
#   sudo ln -s /etc/nginx/sites-available/solgar /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace SERVER_NAME_HERE with the actual hostname before use.

upstream solgar_app {
    server unix:/run/solgar/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name SERVER_NAME_HERE;

    # Certbot will add the HTTPS redirect here once SSL is configured.

    client_max_body_size 20M;

    # Static files served directly by Nginx (faster than passing to Django).
    location /static/ {
        alias /var/www/solgar-platform/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/solgar-platform/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://solgar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}